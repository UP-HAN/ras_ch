# nginx 서버 블록 예시 (PRD 11장). /etc/nginx/sites-available/ras.ches.es.kr 로 복사 후
#   sudo ln -s /etc/nginx/sites-available/ras.ches.es.kr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ras.ches.es.kr   (Let's Encrypt, HTTPS 블록은 certbot 이 추가)
server {
    listen 80;
    server_name ras.ches.es.kr;

    root /var/app/ras/client/dist;
    index index.html;

    client_max_body_size 12m;   # 이미지 5MB × 2장 + 여유
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    # API·업로드·헬스체크 → Node (pm2, 3300)
    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3300;
    }

    # 해시가 붙은 정적 자산은 오래 캐시
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA 라우팅
    location / {
        try_files $uri $uri/ /index.html;
    }
}
