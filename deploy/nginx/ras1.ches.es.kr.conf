# 시연(가상 데이터) 인스턴스 — 운영과 같은 서버, 다른 디렉터리·포트(3301). 검색엔진 색인 금지.
#   sudo cp deploy/nginx/ras1.ches.es.kr.conf /etc/nginx/sites-available/ras1.ches.es.kr
#   sudo ln -s /etc/nginx/sites-available/ras1.ches.es.kr /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ras1.ches.es.kr
server {
    listen 80;
    server_name ras1.ches.es.kr;

    root /var/app/ras-demo/client/dist;
    index index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 12m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/manifest+json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:3301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /uploads/ {
        proxy_pass http://127.0.0.1:3301;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3301;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
