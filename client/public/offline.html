<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>초롱 RAS 포인트 · 오프라인</title>
    <style>
      body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; background: #fff9f2; color: #1f2937; }
      main { min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
      h1 { font-size: 24px; margin: 12px 0 8px; }
      p { font-size: 18px; color: #6b7280; margin: 0 0 20px; line-height: 1.5; }
      button { min-height: 48px; padding: 0 24px; font-size: 18px; font-weight: 700; color: #fff; background: #c96a0f; border: 0; border-radius: 12px; }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 56px" aria-hidden="true">🏮</div>
      <h1>인터넷이 연결되지 않았어요</h1>
      <p>와이파이나 데이터를 켜고<br />다시 열어 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
